{% if rows %}<ul class="capability-list">{% for r in rows %}<li><strong>{{ r.device.name }}</strong> <small>{{ r.device.get_vendor_display }} · {{ r.device.site.name }}</small> <span class="pill capability-{{ r.mode }}">{{ r.label }}</span><small>{{ r.note }}</small></li>{% endfor %}</ul><p class="source-note">Qué admite cada fabricante: <a href="{% url 'vendor_capabilities' %}">Capacidades por fabricante</a>.</p>{% endif %}

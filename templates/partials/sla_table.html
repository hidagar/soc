<div class="table-wrap"><table><thead><tr><th>Gravedad</th>{% for field in rows.0.fields %}<th>{{ field.label }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr><td><span class="pill {{ row.severity }}">{{ row.label }}</span></td>{% for field in row.fields %}<td><input class="input" name="{{ field.name }}" value="{{ field.value }}" placeholder="{{ field.placeholder }}" aria-label="{{ field.label }} · {{ row.label }}" maxlength="20"></td>{% endfor %}</tr>{% endfor %}</tbody></table></div>

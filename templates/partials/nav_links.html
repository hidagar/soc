{% for item in items %}<a href="{{ item.href }}"{% if item.current %} aria-current="page"{% endif %}{% if item.external %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.label }}{% if item.count %} <span class="nav-badge{% if item.urgent %} urgent{% endif %}">{{ item.count }}<span class="visually-hidden"> pendiente{{ item.count|pluralize }}</span></span>{% endif %}{% if item.external %} <span aria-hidden="true">↗</span><span class="visually-hidden"> (se abre en otra pestaña)</span>{% endif %}</a>{% endfor %}

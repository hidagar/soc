# Centro SOC: registro de accesos sin los secretos que viajan en la URL (contexto http).
# Lo instalan deploy/install.sh y deploy/configurar_registros.sh en /etc/nginx/conf.d/; el servidor del
# portal lo usa con «access_log /var/log/nginx/access.log soc_redacted;». Mismas reglas que
# socportal/log_redaction.py: enlaces de informes, listas de bloqueo de los firewalls e invitaciones.
map $request_uri $soc_log_uri {
    "~^(?<soc_u1>/reports/)[^/?]{20,}(?<soc_u2>.*)$"        "${soc_u1}[oculto]${soc_u2}";
    "~^(?<soc_u1>/feeds/bloqueo/\d+/)[^/?]+(?<soc_u2>.*)$"   "${soc_u1}[oculto]${soc_u2}";
    "~^(?<soc_u1>/activate/\d+/)[^/?]{20,}(?<soc_u2>.*)$"    "${soc_u1}[oculto]${soc_u2}";
    default $request_uri;
}

map $http_referer $soc_log_referer {
    "~^(?<soc_r1>.*?/reports/)[^/?]{20,}(?<soc_r2>.*)$"      "${soc_r1}[oculto]${soc_r2}";
    "~^(?<soc_r1>.*?/feeds/bloqueo/\d+/)[^/?]+(?<soc_r2>.*)$" "${soc_r1}[oculto]${soc_r2}";
    "~^(?<soc_r1>.*?/activate/\d+/)[^/?]{20,}(?<soc_r2>.*)$"  "${soc_r1}[oculto]${soc_r2}";
    default $http_referer;
}

log_format soc_redacted '$remote_addr - $remote_user [$time_local] "$request_method $soc_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$soc_log_referer" "$http_user_agent"';
